spring.application.name=backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}

# Connection Pool (recommended for production)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# DigitalOcean Spaces Configuration
do.spaces.key=${DO_SPACES_KEY}
do.spaces.secret=${DO_SPACES_SECRET}
do.spaces.endpoint=${DO_SPACES_ENDPOINT:https://nyc3.digitaloceanspaces.com}
do.spaces.region=${DO_SPACES_REGION:nyc3}
do.spaces.bucket=${DO_SPACES_BUCKET:onepagebuilder-sites}
do.spaces.cdn-endpoint=${DO_SPACES_CDN_ENDPOINT:https://onepagebuilder-sites.nyc3.cdn.digitaloceanspaces.com}

